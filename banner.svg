<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sanjay S - AI and Data Science student - Full Stack Developer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04020d"/><stop offset="0.55" stop-color="#0a0f2e"/><stop offset="1" stop-color="#150a33"/></linearGradient>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67e8f9"/><stop offset="0.5" stop-color="#a5b4fc"/><stop offset="1" stop-color="#fde047"/></linearGradient>
<linearGradient id="boltg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#fde047"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<radialGradient id="gA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2563eb" stop-opacity="0.5"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
<radialGradient id="gB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
</defs>
<style>
.cur { stroke-dasharray: 36 364; animation: run 3.2s linear infinite; }
.cur2 { stroke-dasharray: 30 370; animation: run 2.6s linear infinite; }
@keyframes run { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -400; } }
.b1 { opacity: 0; animation: strike 6s linear infinite 1s; }
.b2 { opacity: 0; animation: strike 6s linear infinite 3.2s; }
.b3 { opacity: 0; animation: strike 6s linear infinite 4.6s; }
@keyframes strike { 0%,86% { opacity: 0; } 87% { opacity: 1; } 89% { opacity: 0.15; } 91% { opacity: 1; } 95% { opacity: 0; } 100% { opacity: 0; } }
.flash { opacity: 0; animation: flash 6s linear infinite 1s; }
@keyframes flash { 0%,86% { opacity: 0; } 87% { opacity: 0.16; } 89% { opacity: 0.02; } 91% { opacity: 0.12; } 95% { opacity: 0; } 100% { opacity: 0; } }
.title { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 92px; font-weight: 800; letter-spacing: 6px; }
.name { animation: rise 1.4s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
.halo { animation: pulse 3s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 0.8; } }
.sub { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 19px; letter-spacing: 4px; fill: #e0e7ff; animation: fade 2s ease-out 0.8s both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.under { stroke-dasharray: 560; stroke-dashoffset: 560; animation: draw 1.6s ease-out 1s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.cursor { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.blobA { animation: drift 10s ease-in-out infinite; }
.blobB { animation: drift 13s ease-in-out infinite reverse; }
@keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(40px); } }
</style>
